name: Keep API Alive

on:
  schedule:
    - cron: '*/10 * * * *' # S'exécute toutes les 10 minutes
  workflow_dispatch:      # Permet de lancer le script manuellement !

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://onrender.com
