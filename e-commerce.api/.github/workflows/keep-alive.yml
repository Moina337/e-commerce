name: Keep API Alive

on:
  schedule:
    - cron: '*/10 * * * *' # S'exécute automatiquement toutes les 10 minutes

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          curl -I -s -o /dev/null -w "%{http_code}" https://ecommerce-api-1eu4.onrender.com
