name: Keep API Alive

on:
  schedule:
    - cron: '*/10 * * * *' # S'exécute toutes les 10 minutes
  workflow_dispatch:      # Ngir nga mën ko tàkkal sa loxo saa su nekk

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://ecommerce-api-1eu4.onrender.com/actuator/health)
          echo "HTTP status: $code"
          test "$code" = "200"
