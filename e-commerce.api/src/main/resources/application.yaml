spring:
  application:
    name: ecommerce-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false

  servlet:
    multipart:
      max-file-size: ${APP_STORAGE_MAX_FILE_SIZE:5MB}
      max-request-size: ${APP_STORAGE_MAX_REQUEST_SIZE:10MB}

server:
  port: ${SERVER_PORT:8080}

jwt:
  expiration: ${JWT_EXPIRATION:86400000}

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./uploads/images}
    max-file-size: ${APP_STORAGE_MAX_FILE_SIZE:5MB}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}	

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health